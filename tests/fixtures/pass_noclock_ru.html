<html><head><meta charset=utf-8><title>CHARGEU base 32A</title><style>body { background: #FFA500; font: 30pt Verdana; color: #000000;}form { font: bold 35pt Verdana;}h1 { font: bold 35pt Verdana;}.ins { margin: 10px 0px 10px 0px; font: bold 35pt Verdana; color: #000000; background-color: #e6e6e6;}.out { margin: 20px 0px 0px 0px; font: 22pt Verdana; color: #000000; padding-top:3px; background-color: #ffcc66;}input[type=button], input[type=submit] { background-color: green; border: none; color: white; padding: 16px 32px; text-decoration: none;margin: 4px 2px; cursor: pointer; font-size: 40pt; font-weight: bold;}input[type=text], input[type=time]{ width: 280px; background-color: yellow; padding: 8px 16px; text-decoration: none; margin: 4px 2px; cursor: pointer; font-size: 35pt; font-weight: bold; text-align: center;}select { padding: 16px 20px; border: none; border-radius: 4px; background-color: yellow; font-size: 40pt;}</style></head><body><center><script>setInterval(function(){var t = new Date();var day1 = t.getDate();var month1 = t.getMonth() + 1;var year1 = t.getFullYear();var hour1 = t.getHours();var minute1 = t.getMinutes();var second1 = t.getSeconds();if (month1 < 10) month1 = '0' + month1;if (day1 < 10) day1 = '0' + day1;if (hour1 < 10) hour1 = '0' + hour1;if (minute1 < 10) minute1 = '0' + minute1;if (second1 < 10) second1 = '0' + second1;var today1 = day1 + '/' + month1 + '/' + year1 + '  ' + hour1 + ':' + minute1 + ':' +second1;document.getElementById('sttime').innerHTML = today1;}, 1000);</script><h1>ЗАЩИТА СТАНЦИИ И ТАЙМЕР<br>CHARGEU base 8302</h1><div class=out>Статус зарядной станции<div class=ins>ЗАБЛОКИРОВАНА<form method=post action=pass><input name=change1 value='$AVAIL 0' type=hidden><input type=submit value='СДЕЛАТЬ ДОСТУПНОЙ'></form></div></div><div class=out>Разовая зарядная сессия<div class=ins><form method=post action=pass><input name=change1 value='$TEMPS 1' type=hidden><input type=submit value='ВКЛЮЧИТЬ'></form></div></div><br><div class=out>Дата/время станции<div class=ins>НЕ УСТАНОВЛЕНО<br><form method=post action=pass><input type=hidden id=theDate name=newtime><input type=submit value='ОБНОВИТЬ ВРЕМЯ'></form></div></div><br><form method=post action=pass><div class=out>Таймер<div class=ins>ВЫКЛЮЧЕН</div></div></form><br><a href='/'>НА ГЛАВНУЮ СТРАНИЦУ</a><br><br><a href='/setup'>НА СТРАНИЦУ НАСТРОЕК</a><br><br><script>setInterval(function () {var date = new Date();var day = date.getDate();var month = date.getMonth() + 1;var year = date.getFullYear();var hour = date.getHours();var minute = date.getMinutes();var second = date.getSeconds();if (month < 10) month = '0' + month;if (day < 10) day = '0' + day;if (hour < 10) hour = '0' + hour;if (minute < 10) minute = '0' + minute;if (second < 10) second = '0' + second;var today = year + '-' + month + '-' + day + 'T' + hour + ':' + minute + ':' +second;document.getElementById('theDate').value = today;}, 1000);</script><br><a href=WWW.CHARGEU.EU>WWW.CHARGEU.EU</a><BR>2015-2018<br><br></center></body></html>
