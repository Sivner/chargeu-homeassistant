econd = date.getSeconds();if (month < 10) month = '0' + month;if (day < 10) day = '0' + day;if (hour < 10) hour = '0' + hour;if (minute < 10) minute = '0' + minute;if (second < 10) second = '0' + second;var today = year + '-' + month + '-' + day + 'T' + hour + ':' + minute + ':' +second;document.getElementById('theDate').value = today;}, 1000);</script><br><a href=WWW.CHARGEU.EU>WWW.CHARGEU.EU</a><BR>2015-2018<br><br></center></body></html>
